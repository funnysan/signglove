<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>SignGlove Remote</title>
<style>
  :root {
    --bg: #f5f6f4; --surface: #ffffff; --surface-2: #eef1ee; --text: #17201c; --muted: #5d6b64;
    --line: #dfe5e1; --accent: #0f766e; --accent-2: #14b8a6; --accent-ink: #ffffff;
    --good: #15803d; --bad: #b91c1c; --warn: #b45309; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1412; --surface: #161e1b; --surface-2: #1f2925; --text: #e8efeb; --muted: #95a59d;
      --line: #2a3632; --accent: #2dd4bf; --accent-2: #5eead4; --accent-ink: #062b27;
      --good: #4ade80; --bad: #f87171; --warn: #fbbf24; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; gap: 12px; height: 56px; }
  .brand { font-weight: 700; letter-spacing: -.01em; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .brand svg { width: 24px; height: 24px; color: var(--accent); }
  .pill { margin-left: auto; font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--surface-2);
    color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .pill.on { color: var(--good); } .pill.on i { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
  .pill.demo { color: var(--warn); } .pill.demo i { background: var(--warn); }

  section.tab { display: none; padding: 16px 0 24px; } section.tab.active { display: block; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h2 { font-size: 15px; margin: 0 0 4px; } .card p.sub { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  h3.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 4px 8px; font-weight: 600; }

  .btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 15px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.danger { color: var(--bad); }
  .btn.small { padding: 6px 10px; font-size: 13px; border-radius: 10px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .connect-opt { width: 100%; display: flex; gap: 14px; align-items: center; text-align: left; padding: 14px;
    border-radius: 14px; border: 1px solid var(--line); background: var(--surface); margin-bottom: 10px; }
  .connect-opt:hover { border-color: var(--accent); }
  .connect-opt .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--accent); flex: none; }
  .connect-opt .ico svg { width: 22px; height: 22px; }
  .connect-opt b { display: block; font-size: 16px; } .connect-opt span { color: var(--muted); font-size: 13px; }
  .connect-opt.rec { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .note { font-size: 13px; color: var(--muted); padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
  .note.warn { color: var(--warn); }

  .say-card { text-align: center; padding: 28px 16px 22px; }
  .say-text { font-size: clamp(34px, 10vw, 56px); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; min-height: 1.2em; margin: 6px 0 10px; overflow-wrap: anywhere; }
  .say-text.idle { color: var(--muted); font-weight: 600; font-size: 22px; }
  .say-text.pop { animation: pop .45s ease-out; }
  @keyframes pop { 0% { transform: scale(.92); opacity: .3; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); } }
  .seeing { font-size: 14px; color: var(--muted); }
  .toggle { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; user-select: none; }
  .switch { width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; flex: none; border: 0; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch[aria-checked="true"] { background: var(--accent); } .switch[aria-checked="true"]::after { transform: translateX(18px); }

  .history { list-style: none; margin: 0; padding: 0; }
  .history li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .history li:last-child { border-bottom: 0; }
  .history time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; flex: none; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 12px; }

  .hand { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; align-items: end; height: 170px; padding: 6px 4px 0; }
  .finger { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
  .bar { position: relative; flex: 1; width: 100%; max-width: 46px; border-radius: 23px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
  .bar > div { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, var(--accent), var(--accent-2)); transition: height .18s linear; border-radius: 23px; }
  .finger small { font-size: 12px; color: var(--muted); } .finger b { font-size: 14px; font-variant-numeric: tabular-nums; }
  .finger:nth-child(1) .bar { max-width: 46px; height: 70%; flex: none; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .stat { background: var(--surface-2); border-radius: 12px; padding: 8px 10px; }
  .stat small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .stat b { font-size: 15px; font-variant-numeric: tabular-nums; }

  .phrase { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .phrase:last-child { border-bottom: 0; }
  .phrase .num { width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-size: 13px; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
  .phrase .txt { flex: 1; min-width: 0; } .phrase .txt b { display: block; font-size: 15px; overflow-wrap: anywhere; }
  .phrase .txt span { font-size: 12px; color: var(--muted); }
  .phrase .txt span.trained { color: var(--good); } .phrase .txt span.none { color: var(--warn); }
  .phrase .acts { display: flex; gap: 6px; flex: none; }
  .phrase.live { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 10px; }

  input[type=range] { width: 100%; accent-color: var(--accent); }
  select, input[type=text] { width: 100%; font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); }
  .field { margin-bottom: 14px; } .field label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .field label span { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }

  .log { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface-2); border-radius: 12px; padding: 10px; height: 46vh; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  .log .in { color: var(--text); } .log .out { color: var(--accent); } .log .sys { color: var(--muted); }

  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav .wrap { display: grid; grid-template-columns: repeat(5, 1fr); }
  nav button { background: none; border: 0; padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 600; }
  nav button svg { width: 22px; height: 22px; }
  nav button.active { color: var(--accent); }
  /* big screens: tabs go at the top, under the title */
  @media (min-width: 760px) {
    nav { position: sticky; top: 56px; bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); padding-bottom: 0; }
    nav button { flex-direction: row; justify-content: center; gap: 8px; font-size: 15px; padding: 12px 0; }
    nav button.active { box-shadow: inset 0 -3px 0 var(--accent); }
    body { padding-bottom: 24px; }
    .toast { bottom: 24px; }
  }

  /* signs */
  .signs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .sign { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; min-width: 0; }
  .sign.said { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .sign svg { width: 92px; height: 103px; display: block; margin: 0 auto 6px; }
  .sign b { display: block; font-size: 15px; overflow-wrap: anywhere; }
  .sign p { margin: 4px 0 6px; font-size: 13px; color: var(--muted); }
  .sign .chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .sign .chip.taught { color: var(--good); } .sign .chip.none { color: var(--warn); }
  .hs rect { stroke: var(--surface); stroke-width: 2.5; }
  .hs .palm { fill: color-mix(in srgb, var(--accent) 28%, var(--surface-2)); }
  .hs .up { fill: var(--accent); }
  .hs .half { fill: color-mix(in srgb, var(--accent) 62%, var(--surface-2)); }
  .hs .down { fill: color-mix(in srgb, var(--muted) 70%, var(--surface)); }
  .hs .q { fill: var(--muted); font: 700 22px system-ui, sans-serif; }
  .phrase .mini { width: 30px; height: 34px; flex: none; }
  .phrase .mini svg { width: 30px; height: 34px; display: block; }
  .key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .key svg { width: 12px; height: 14px; }
  .key .up { fill: var(--accent); } .key .half { fill: color-mix(in srgb, var(--accent) 60%, var(--surface-2)); } .key .down { fill: color-mix(in srgb, var(--muted) 45%, var(--surface-2)); }
  .sign .btn { margin-top: 8px; width: 100%; }
  .signs-link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }

  .overlay { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 94%, transparent); display: none; place-items: center; text-align: center; padding: 24px; backdrop-filter: blur(6px); }
  .overlay.show { display: grid; }
  .overlay .big { font-size: 110px; font-weight: 800; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; min-height: 110px; }
  .overlay .msg { font-size: clamp(22px, 6vw, 32px); font-weight: 700; max-width: 520px; margin: 18px auto 0; }
  .overlay .hint { color: var(--muted); margin-top: 12px; }

  .toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); z-index: 30;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; transition: all .25s; max-width: calc(100% - 32px); pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--bad); color: #fff; } .toast.ok { background: var(--good); color: #fff; }
  .banner { display: none; align-items: center; gap: 10px; justify-content: space-between; } .banner.show { display: flex; }
  .hidden { display: none !important; }
  .remote-pair { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .remote-qr { background: #fff; padding: 8px; border-radius: 10px; line-height: 0; }
  .remote-qr img, .remote-qr canvas { width: 132px; height: 132px; }
  .remote-code { font-size: 32px; font-weight: 700; letter-spacing: 3px; font-variant-numeric: tabular-nums; margin: 4px 0; }
</style>
<style>
  body { padding-bottom: 32px; }
  main { padding: 16px 0 24px; }
  .toast { bottom: 24px; }
  .phrase-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .phrase { min-height: 68px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--surface); box-shadow: var(--shadow); font-size: 17px; font-weight: 650; line-height: 1.2; text-align: left;
    transition: transform .08s, background .15s, color .15s; touch-action: manipulation; }
  .phrase:active { transform: scale(.97); }
  .phrase.sent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .code-input { width: 100%; font: 700 30px/1 system-ui, sans-serif; letter-spacing: 6px; text-align: center; padding: 12px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); }
  .type-row { display: flex; gap: 8px; }
  .type-row input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--text); }
  .linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 14px; padding: 8px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v1M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
      SignGlove
    </div>
    <div class="pill" id="pill"><i></i><span id="pillText">Not paired</span></div>
  </div>
</header>

<main class="wrap">
  <!-- step 1: type the laptop's code -->
  <div class="card hidden" id="pairCard">
    <h2>Pair with the laptop</h2>
    <p class="sub">On the laptop, open the SignGlove page. Type the 6-digit code from its <b>Phone remote</b> box.</p>
    <form id="pairForm">
      <input class="code-input" id="codeInput" type="tel" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="123 456" aria-label="Laptop code">
      <button class="btn primary" type="submit" style="width:100%;margin-top:12px">Pair</button>
    </form>
  </div>

  <!-- step 2: the buttons -->
  <div class="hidden" id="remoteArea">
    <p class="seeing" id="statusLine" style="margin:0 4px 12px">Looking for the laptop…</p>
    <div class="phrase-grid" id="grid"></div>
    <div class="card" style="margin-top:14px">
      <h2>Type something</h2>
      <form class="type-row" id="typeForm" style="margin-top:8px">
        <input id="typeInput" type="text" maxlength="80" placeholder="e.g. My name is Sam" autocomplete="off" aria-label="Words to say">
        <button class="btn primary" type="submit">Say</button>
      </form>
    </div>
    <div style="text-align:center"><button class="linkish" id="changeCode">Change laptop code</button></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
"use strict";
// Each button sends its words through ntfy.sh (a free message relay) to the
// laptop's SignGlove page, which says them out loud. Same phrases as the glove.
const PHRASES = ["Hello", "Yes", "No", "Thank you", "I love you", "I need help", "I need water", "Good",
  "Okay", "Call me", "I need the bathroom", "I am hungry", "Nice to meet you", "Goodbye", "Sorry", "Please"];
const RELAY = "https://ntfy.sh/";
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("sgr_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("sgr_" + k, JSON.stringify(v)); } catch {} }
};

let toastTimer;
function toast(msg, kind = "") {
  const t = $("toast"); t.textContent = msg; t.className = "toast show " + kind;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = "toast " + kind), 1800);
}
function setPill(text, kind) { $("pill").className = "pill " + (kind || ""); $("pillText").textContent = text; }

// ----- pairing
let code = "", es = null, laptopTimer = null;
const fromLink = (location.hash.match(/\d{6}/) || [])[0];
if (fromLink) { store.set("code", fromLink); history.replaceState(null, "", location.pathname); }
usePair(fromLink || store.get("code", ""));

function usePair(c) {
  code = /^\d{6}$/.test(c || "") ? c : "";
  if (es) { es.close(); es = null; }
  $("pairCard").classList.toggle("hidden", !!code);
  $("remoteArea").classList.toggle("hidden", !code);
  if (!code) { setPill("Not paired"); setTimeout(() => $("codeInput").focus(), 50); return; }
  setPill("Looking for laptop…", "demo");
  $("statusLine").textContent = "Looking for the laptop…";
  if ("EventSource" in window) {
    es = new EventSource(RELAY + `signglove-${code}-back/sse`);
    es.onopen = () => post({ ping: 1 }).catch(() => {});
    es.onmessage = (e) => {
      let m, msg; try { m = JSON.parse(e.data); msg = JSON.parse(m.message); } catch { return; }
      if (m.event === "message" && msg && msg.here) laptopFound();
    };
  }
  clearTimeout(laptopTimer);
  laptopTimer = setTimeout(() => {
    setPill("Laptop not found");
    $("statusLine").textContent = "Can't find the laptop. Is the SignGlove page open on it, with the code " + code.replace(/(\d{3})(\d{3})/, "$1 $2") + "? Buttons still send.";
  }, 6000);
}
function laptopFound() {
  clearTimeout(laptopTimer);
  setPill("Laptop ready", "on");
  $("statusLine").textContent = "Tap a button and the laptop says it.";
}
$("pairForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const c = $("codeInput").value.replace(/\D/g, "");
  if (c.length !== 6) { toast("The code has 6 numbers", "err"); return; }
  store.set("code", c); usePair(c);
});
$("changeCode").addEventListener("click", () => { store.set("code", ""); $("codeInput").value = ""; usePair(""); });

// ----- sending
async function post(obj) {
  const r = await fetch(RELAY + `signglove-${code}-say?cache=no&firebase=no`, { method: "POST", body: JSON.stringify(obj) });
  if (r.status === 429) throw new Error("busy");
  if (!r.ok) throw new Error("fail");
}
async function say(text, btn) {
  if (!text || !code) return;
  if (navigator.vibrate) navigator.vibrate(20);
  try {
    await post({ say: text });
    toast("Sent: " + text, "ok");
    if (btn) { btn.classList.add("sent"); setTimeout(() => btn.classList.remove("sent"), 600); }
  } catch (e) {
    toast(e.message === "busy" ? "Too many taps. Wait a few seconds." : "Couldn't send. Is the phone online?", "err");
  }
}
for (const p of PHRASES) {
  const b = document.createElement("button"); b.className = "phrase"; b.textContent = p;
  b.addEventListener("click", () => say(p, b));
  $("grid").appendChild(b);
}
$("typeForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("typeInput").value.trim();
  if (v) { say(v.slice(0, 80)); $("typeInput").value = ""; }
});
</script>
</body>
</html>
